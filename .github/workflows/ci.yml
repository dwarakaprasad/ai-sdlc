name: CI

on:
  pull_request:
  push:
    branches: [main, make-a-better-ui]

permissions:
  contents: read

# A newer push to the same PR or branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node the README promises, and the one the Docker image runs.
        node: ["20.12", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run curriculum:check

  # Whole user flows in a real browser, against the server in end-to-end mode (no API key needed).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # A Parent can set up a household on the app started exactly as the README says: the real compose file, image and ./curricula.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run the container as the runner's user, so it can write to the checked-out ./data.
      - run: |
          echo "HOME_TUTOR_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOME_TUTOR_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:docker
      - if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-compose
          path: |
            playwright-report
            test-results
          retention-days: 7
      - if: always()
        run: docker compose down

  # The one check branch protection requires, so the jobs above can change without editing the rules.
  ci:
    if: always()
    needs: [check, e2e, compose]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: test "${{ needs.check.result }}" = success && test "${{ needs.e2e.result }}" = success && test "${{ needs.compose.result }}" = success
