name: CI

on:
  pull_request:
  push:
    branches: [main, make-a-better-ui]

permissions:
  contents: read

# A newer push to the same PR or branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node the README promises, and the one the Docker image runs.
        node: ["20.12", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run curriculum:check

  # Whole journeys in a real browser, against the server in end-to-end mode (no API key needed).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The one check branch protection requires, so the jobs above can change without editing the rules.
  ci:
    if: always()
    needs: [check, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: test "${{ needs.check.result }}" = success && test "${{ needs.e2e.result }}" = success
